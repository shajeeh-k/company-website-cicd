name: Deploy to EC2 via SCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Config and Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          
          cat <<EOF > ~/.ssh/config
          Host ec2-target
              HostName ${{ secrets.EC2_HOST }}
              User ${{ secrets.EC2_USER }}
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to Web Server
        run: |
          # 1. Upload to user home folder (Guaranteed write permissions)
          scp -r . ec2-target:~/deploy_temp/
          
          # 2. Sync to web root with elevated privileges and remove temp folder
          ssh ec2-target "sudo rsync -av --delete ~/deploy_temp/ /var/www/html/ && rm -rf ~/deploy_temp"
