name: Deploy to EC2 via SCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Config and Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          
          cat <<EOF > ~/.ssh/config
          Host ec2-target
              HostName ${{ secrets.EC2_HOST }}
              User ${{ secrets.EC2_USER }}
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Fix Permissions and Transfer Files
        run: |
          # 1. Update folder ownership on remote EC2 host
          ssh ec2-target "sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /var/www/html"
          
          # 2. Sync files over SCP
          scp -v -r . ec2-target:/var/www/html/
